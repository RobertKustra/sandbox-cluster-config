apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
      name: platform
    patch: |-
      - op: replace
        path: /metadata/name
        value: cert-manager
      - op: add
        path: /metadata/labels
        value:
          app.kubernetes.io/managed-by: flux
      - op: add
        path: /metadata/annotations/sandbox.local~1description
        value: Certificate management