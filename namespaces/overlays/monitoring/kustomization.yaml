apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
      name: platform
    patch: |-
      - op: replace
        path: /metadata/name
        value: monitoring
      - op: add
        path: /metadata/labels
        value:
          environment: monitoring
      - op: add
        path: /metadata/annotations/sandbox.local~1description
        value: Monitoring and observability