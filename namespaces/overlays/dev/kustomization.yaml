apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
      name: placeholder-namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev
      - op: add
        path: /metadata/labels
        value:
          environment: dev
      - op: replace
        path: /metadata/annotations
        value:
          my-annotation: "true"