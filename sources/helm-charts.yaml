apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sandbox-helm-charts
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/RobertKustra/sandbox-helm-charts.git
  ref:
    branch: main
  secretRef:
    name: flux-system
