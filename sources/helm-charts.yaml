apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sandbox-env-values
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/RobertKustra/sandbox-env-values.git
  ref:
    branch: main
  secretRef:
    name: flux-system
