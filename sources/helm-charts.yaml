apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sandbox-helm-charts
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/RobertKustra/sandbox-helm-charts.git
  ref:
    branch: development
  secretRef:
    name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sandbox-env-values
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/RobertKustra/sandbox-env-values.git
  ref:
    branch: development
  secretRef:
    name: sandbox-env-values-write
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.external-secrets.io
