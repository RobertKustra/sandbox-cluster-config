apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: __ENV__
resources:
  - ./namespace.yaml
  - ../../base
configMapGenerator:
  - name: sandbox-nginx-values-env
    files:
      - values.yaml=sandbox-nginx.yaml
  - name: sandbox-redis-values-env
    files:
      - values.yaml=sandbox-redis-values.yaml
  - name: sandbox-ai-consumer-values-env
    files:
      - values.yaml=sandbox-ai-consumer-values.yaml
generatorOptions:
  disableNameSuffixHash: true
