apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  labels:
    app.kubernetes.io/name: gpu-smoke-test
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvidia/cuda:12.9.2-cudnn-runtime-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1