apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sandbox-vllm
spec:
  interval: 5m
  chart:
    spec:
      chart: charts/sandbox-vllm
      version: "0.1.2"
      sourceRef:
        kind: GitRepository
        name: sandbox-helm-charts
        namespace: flux-system
  values:
    replicaCount: 1
    image:
      repository: vllm/vllm-openai
      tag: latest
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8000
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics

    model:
      args:
        - Qwen/Qwen3-4B-Instruct-2507
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --dtype
        - half
        - --max-model-len
        - "9216"
        - --max-num-seqs
        - "4"
        - --gpu-memory-utilization
        - "0.6"
        - --served-model-name
        - ziutek_2.0

    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-token
            key: HF_TOKEN
      - name: VLLM_USE_V2_MODEL_RUNNER
        value: "0"
      - name: PYTORCH_CUDA_ALLOC_CONF
        value: "expandable_segments:True"

    probes:
      startup:
        initialDelaySeconds: 120
        periodSeconds: 15
        failureThreshold: 240
        timeoutSeconds: 5
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 6
        timeoutSeconds: 3
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 20
        failureThreshold: 3
        timeoutSeconds: 3

    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
        nvidia.com/gpu: 1

    persistence:
      enabled: true
      claimName: sandbox-vllm-model-cache
      size: 30Gi
      accessModes:
        - ReadWriteOnce
      mountPath: /root/.cache/huggingface

    shm:
      enabled: true
      mountPath: /dev/shm
      sizeLimit: 2Gi

    smokeTest:
      enabled: true
      image:
        repository: curlimages/curl
        tag: "8.9.1"
        pullPolicy: IfNotPresent
      retries: 30
      sleepSeconds: 5