apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-vllm-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: sandbox-vllm.llm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandbox-vllm
                port:
                  number: 8000
