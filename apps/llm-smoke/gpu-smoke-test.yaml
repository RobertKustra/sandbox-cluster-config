apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke-test
  labels:
    app.kubernetes.io/name: gpu-smoke-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cuda
          image: nvidia/cuda:12.9.2-cudnn-runtime-ubuntu24.04
          command: ["nvidia-smi"]
          resources:
            limits:
              nvidia.com/gpu: 1