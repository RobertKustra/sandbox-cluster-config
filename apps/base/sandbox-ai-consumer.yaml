apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sandbox-ai-consumer
spec:
  interval: 5m
  chart:
    spec:
      chart: charts/sandbox-ai-consumer
      version: "0.1.2"
      sourceRef:
        kind: GitRepository
        name: sandbox-helm-charts
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: sandbox-ai-consumer-values-base
    - kind: ConfigMap
      name: sandbox-ai-consumer-values-env