apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
spec:
  interval: 5m
  chart:
    spec:
      chart: charts/redis
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: sandbox-helm-charts
        namespace: flux-system
  values:
    auth:
      enabled: true
      existingSecret: redis-auth
      existingSecretPasswordKey: redis-password
  valuesFrom:
    - kind: ConfigMap
      name: redis-values-base
    - kind: ConfigMap
      name: redis-values-env