# Self-signed root CA ClusterIssuer — used to bootstrap the sandbox-ca Certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Root CA certificate issued by the self-signed issuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: sandbox-ca
  secretName: sandbox-ca-secret
  duration: 87600h   # 10 years
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA ClusterIssuer that signs leaf certificates for all sandbox Ingresses.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sandbox-ca-issuer
spec:
  ca:
    secretName: sandbox-ca-secret
