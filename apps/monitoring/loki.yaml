apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 5m
  suspend: true
    loki:
      structuredConfig:
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
    loki:
      config: |
        schema_config:
          configs:
            - from: 2020-10-15
              store: boltdb-shipper
              object_store: filesystem
              schema: v11
              index:
                prefix: index_
                period: 24h
        storage_config:
          boltdb_shipper:
            active_index_directory: /data/loki/index
            shared_store: filesystem
          filesystem:
            directory: /data/loki/chunks
          filesystem:
            directory: /data/loki/chunks
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "standard"
    service:
      type: ClusterIP
