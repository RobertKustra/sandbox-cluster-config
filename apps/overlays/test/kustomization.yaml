apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test
resources:
  - ../../base
secretGenerator:
  - name: sandbox-redis-auth
    literals:
      - sandbox-redis-password=test-change-me
  - name: sandbox-ai-consumer-env
    literals:
      - VLLM_PROMPT=Test environment prompt for sandbox-ai-consumer
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Ingress
      name: sandbox-nginx-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sandbox-nginx.test.local