apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
#  - ../../sandbox-ai-consumer/base
  - ../../sandbox-nginx/base
  - ../../sandbox-redis/base
secretGenerator:
  - name: sandbox-redis-auth
    literals:
      - sandbox-redis-password=vllm-change-me
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Ingress
      name: sandbox-nginx-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sandbox-nginx.dev.local