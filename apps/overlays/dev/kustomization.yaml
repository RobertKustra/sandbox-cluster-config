apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
secretGenerator:
  - name: redis-auth
    literals:
      - redis-password=dev-change-me
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Ingress
      name: sandbox-nginx-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sandbox-nginx.dev.local