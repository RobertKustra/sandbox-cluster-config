apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-usage-sandbox-vllm-model-cache
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pvc-usage-exporter
              image: alpine:3.22
              command: ["/bin/sh", "-c"]
              args:
                - |
                  used_kib=$(du -sk /volume | awk '{print $1}')
                  used_bytes=$((used_kib * 1024))
                  wget -qO- \
                    --header='Content-Type: text/plain; version=0.0.4' \
                    --post-data="pvc_directory_used_bytes ${used_bytes}" \
                    "http://prometheus-prometheus-pushgateway.monitoring.svc:9091/metrics/job/pvc-directory-usage/namespace/${POD_NAMESPACE}/persistentvolumeclaim/${PVC_NAME}"
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PVC_NAME
                  value: sandbox-vllm-model-cache
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: volume
                  mountPath: /volume
                  readOnly: true
          volumes:
            - name: volume
              persistentVolumeClaim:
                claimName: sandbox-vllm-model-cache
                readOnly: true