apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: sandbox-vllm
    patch: |-
      - op: replace
        path: /spec/values/model/args
        value:
          - QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ
          - --host
          - 0.0.0.0
          - --port
          - "8000"
          - --dtype
          - half
          - --quantization
          - awq
          - --cpu-offload-gb
          - "4"
          - --max-model-len
          - "4096"
          - --max-num-seqs
          - "2"
          - --gpu-memory-utilization
          - "0.90"
          - --enforce-eager
          - --served-model-name
          - ziutek_2.0

      - op: replace
        path: /spec/values/resources/requests
        value:
          cpu: "1"
          memory: 10Gi

      - op: replace
        path: /spec/values/resources/limits
        value:
          cpu: "3"
          memory: 20Gi
          nvidia.com/gpu: 1

      - op: replace
        path: /spec/values/persistence/size
        value: 50Gi