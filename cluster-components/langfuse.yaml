apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-langfuse
  namespace: flux-system
spec:
  dependsOn:
    - name: minikube-clickhouse-operator
    - name: minikube-cert-manager-issuers
    - name: minikube-traefik
  interval: 10m
  path: ./cluster-components/langfuse
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: langfuse
      namespace: langfuse
  timeout: 20m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: langfuse