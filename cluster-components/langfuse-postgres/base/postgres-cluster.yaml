apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: langfuse-postgres
spec:
  postgresVersion: 16
  databaseInitSQL:
    name: langfuse-postgres-init
    key: init.sql
  users:
    - name: langfuse
      databases:
        - langfuse
      password:
        type: AlphaNumeric
  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
  backups:
    pgbackrest:
      global:
        repo1-retention-full: "2"
      repos:
        - name: repo1
          schedules:
            full: "0 2 * * 0"
            incremental: "0 2 * * 1-6"
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi