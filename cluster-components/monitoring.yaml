apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-monitoring
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: minikube-namespaces
    - name: minikube-cert-manager-issuers
    - name: minikube-traefik
  path: ./cluster-components/monitoring
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: monitoring
