apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-cert-manager-issuers
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: minikube-cert-manager
  path: ./cluster-components/cert-manager-issuers
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: cert-manager
