apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: prometheus-alert-rules
    files:
      - values.yaml=alert-rules.yaml
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./namespace.yaml
  - ./prometheus.yaml
  - ./grafana.yaml
  - ./jaeger.yaml
  - ./gpu-exporter.yaml
  - ./promtail.yaml
  - ./loki-stack.yaml
  - ./alertmanager.yaml
  - ./monitoring-ingress.yaml
