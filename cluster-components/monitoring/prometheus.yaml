apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-alert-rules
  values:
    alertmanagers:
      - namespace: monitoring
        name: alertmanager
        port: web
        scheme: http
    server:
      service:
        type: ClusterIP
      extraInitContainers:
        - name: init-storage-permissions
          image: busybox:1.37
          command:
            - sh
            - -c
            - chown -R 65534:65534 /data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: storage-volume
              mountPath: /data
      persistentVolume:
        enabled: true
        size: 8Gi
        storageClass: "standard"