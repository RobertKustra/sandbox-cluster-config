apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: "10.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: grafana-dashboards
  values:
    adminUser: admin
    adminPassword: changeme
    
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-server
            isDefault: true
            editable: true
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki-stack:3100
            isDefault: false
            editable: true
          - name: Jaeger
            uid: jaeger
            type: jaeger
            access: proxy
            url: http://jaeger-query:16686
            isDefault: false
            editable: true

    # Pod-level
    securityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      fsGroupChangePolicy: "OnRootMismatch"

    # Container-level
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      allowPrivilegeEscalation: false

    initChownData:
      enabled: false

    persistence:
      enabled: true
      size: 5Gi
      storageClass: "standard"

    service:
      type: NodePort
      nodePort: 30080