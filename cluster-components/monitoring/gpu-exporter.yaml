apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-exporter
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: dcgm-exporter
      version: "4.8.3"
      sourceRef:
        kind: HelmRepository
        name: dcgm-exporter
        namespace: flux-system
        
  install:
    remediation:
      retries: 3
  values:
    serviceMonitor:
      enabled: false
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: /metrics
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
