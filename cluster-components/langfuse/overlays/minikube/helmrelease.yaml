- op: add
  path: /spec/values/langfuse/global
  value:
    defaultStorageClass: csi-hostpath-sc
- op: add
  path: /spec/values/langfuse/langfuse
  value:
    nextauth:
      url: https://langfuse.local
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: sandbox-ca-issuer
      hosts:
        - host: langfuse.local
          paths:
            - path: /
              pathType: Prefix
      tls:
        enabled: true
        secretName: langfuse-tls
- op: add
  path: /spec/values/langfuse/redis
  value:
    dataStorage:
      requestedSize: 2Gi
      className: csi-hostpath-sc
- op: add
  path: /spec/values/langfuse/clickhouse
  value:
    cluster:
      storage:
        size: 10Gi
        className: csi-hostpath-sc
    keeper:
      replicas: 1
      storage:
        size: 2Gi
        className: csi-hostpath-sc
- op: add
  path: /spec/values/langfuse/s3
  value:
    allInOne:
      data:
        size: 5Gi
        storageClass: csi-hostpath-sc