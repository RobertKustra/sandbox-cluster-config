apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sandbox-ai-consumer-dev
  namespace: flux-system
spec:
  interval: 1m
  image: ghcr.io/robertkustra/dev/sandbox-ai-consumer
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sandbox-ai-consumer-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sandbox-ai-consumer-dev
  policy:
    semver:
      range: ">=0.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sandbox-ai-consumer-prod
  namespace: flux-system
spec:
  interval: 1m
  image: ghcr.io/robertkustra/prod/sandbox-ai-consumer
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sandbox-ai-consumer-prod
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sandbox-ai-consumer-prod
  policy:
    semver:
      range: ">=0.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: sandbox-env-values
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: sandbox-env-values
  git:
    checkout:
      ref:
        branch: development
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore: update sandbox image tags

        Automation: {{ .AutomationObject }}
        Changed files:
        {{- range $file, $_ := .Changed.FileChanges }}
        - {{ $file }}
        {{- end }}
    push:
      branch: development
  update:
    path: ./overlays
    strategy: Setters
