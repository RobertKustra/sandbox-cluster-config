apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sandbox-namespace-dev
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: sandbox-env-values
    namespace: flux-system
  path: ./namespaces/overlays/dev
  prune: true
  wait: true
  timeout: 5m0s
