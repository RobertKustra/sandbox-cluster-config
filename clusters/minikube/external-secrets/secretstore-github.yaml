apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: github-secrets
  namespace: external-secrets
spec:
  provider:
    webhook:
      url: "https://example.invalid/github-secrets"
      headers:
        - name: Authorization
          value: "Bearer REPLACE_WITH_TOKEN"
      result:
        jsonPath: "$.value"
