apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-prod
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: minikube-postgres-operator
    - name: minikube-llm
    - name: minikube-monitoring
    - name: sandbox-env-values-prod
  path: ./clusters/minikube/environments/prod
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-nginx
      namespace: prod
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-redis
      namespace: prod
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-ai-consumer
      namespace: prod
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: prod
