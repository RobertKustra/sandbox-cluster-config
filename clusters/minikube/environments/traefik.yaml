apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-traefik
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: minikube-namespaces
  path: ./clusters/minikube/environments/traefik
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: traefik
