apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-test
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/minikube/environments/test
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: sandbox-cluster-config
  postBuild:
    substitute:
      cluster: minikube
      environment: test
