apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-test
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: minikube-postgres-operator
    - name: minikube-monitoring
    - name: sandbox-env-values-test
  path: ./clusters/minikube/environments/test
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-nginx
      namespace: test
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-redis
      namespace: test
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-ai-consumer
      namespace: test
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: test
