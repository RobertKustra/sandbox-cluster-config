apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-test
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: minikube-namespaces
    - name: minikube-postgres-operator
    - name: minikube-llm
    - name: minikube-monitoring
    - name: sandbox-env-values-test
  path: ./clusters/minikube/environments/test
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: test
