apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-dev
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: minikube-postgres-operator
    - name: minikube-monitoring
    - name: sandbox-env-values-dev
  path: ./clusters/minikube/environments/dev
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-nginx
      namespace: dev
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sandbox-redis
      namespace: dev
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      cluster: minikube
      environment: dev
