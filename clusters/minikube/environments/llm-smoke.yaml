apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minikube-llm-smoke
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/minikube/environments/llm-smoke
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: gpu-smoke-test
      namespace: llm
  postBuild:
    substitute:
      cluster: minikube
      environment: llm