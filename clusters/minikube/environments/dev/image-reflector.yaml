apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sandbox-ai-consumer-dev
  namespace: dev
spec:
  interval: 1m
  image: ghcr.io/robertkustra/dev/sandbox-ai-consumer
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sandbox-ai-consumer-dev
  namespace: dev
spec:
  imageRepositoryRef:
    name: sandbox-ai-consumer-dev
  policy:
    semver:
      range: ">=0.0.0"
