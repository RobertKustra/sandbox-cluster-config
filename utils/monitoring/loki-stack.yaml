apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: loki-stack
      version: "2.10.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    loki:
      enabled: true
      persistence:
        enabled: true
        size: 10Gi
        storageClass: "standard"
    promtail:
      enabled: false
    grafana:
      enabled: false
