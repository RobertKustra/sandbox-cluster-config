apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: "10.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    adminUser: admin
    adminPassword: changeme

    # Pod-level
    securityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      fsGroupChangePolicy: "OnRootMismatch"

    # Container-level
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      allowPrivilegeEscalation: false

    initChownData:
      enabled: false

    persistence:
      enabled: true
      size: 5Gi
      storageClass: "standard"

    service:
      type: NodePort
      nodePort: 30080