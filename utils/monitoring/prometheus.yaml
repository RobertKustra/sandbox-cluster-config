apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    alertmanagers:
      - namespace: monitoring
        name: alertmanager
        port: web
        scheme: http
    server:
      service:
        type: ClusterIP
      persistentVolume:
        enabled: true
        size: 8Gi
        storageClass: "standard"
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: monitoring-alerts
            rules:
              - alert: InstanceDown
                expr: up == 0
                for: 5m
                labels:
                  severity: page
                annotations:
                  summary: 'Instance {{ $labels.instance }} is down'
                  description: 'Instance {{ $labels.instance }} has been down for more than 5 minutes.'
              - alert: HighCpuUsage
                expr: rate(process_cpu_seconds_total[5m]) > 0.9
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'High CPU usage on {{ $labels.job }}'
                  description: 'CPU usage is above 90% for more than 5 minutes.'
